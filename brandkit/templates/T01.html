<!doctype html>
<html><head><meta charset="utf-8">
<!--INJECT-->
<link rel="stylesheet" href="engine/base.css">
<style>
  /* T01 · callouts. Amazon tool-listing pattern: product large, heavy uppercase labels in the margins,
     accent elbow leaders ending in square nodes. Frames: light (accent strip, white over split grey), band (dark header +
     accent rule + footer), plain (studio ground). Tokens come from job.palette. */
  #canvas{--bg:#FFFFFF;--text:#1A1A1A;--muted:#5D666E;--line:#8E969D;--accent:#B3261E;--paper:#FFFFFF;--split:#DCDDDE;
    --leader:var(--accent);--leader-w:4;--node-stroke:#FFFFFF;--ring-gap:#FFFFFF;background:var(--paper)}
  .ground-studio{position:absolute;inset:0;background:radial-gradient(120% 90% at 60% 55%, #FFFFFF 0%, #ECECEA 70%)}
  .ground-split{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom, color-mix(in srgb, var(--split) 0%, var(--paper)) 0, var(--split) var(--sweep,160px), var(--split) 100%)}
  /* anchor marker: an open accent square around the part (the part stays visible inside), white halo for dark and light grounds */
  .mk-halo{fill:none;stroke:#FFFFFF;stroke-width:7.5;stroke-linejoin:miter;opacity:.92}
  .mk-ring{fill:none;stroke:var(--accent);stroke-width:4;stroke-linejoin:miter}
  .strip{position:absolute;left:0;top:0;background:var(--accent)}
  .hdr{position:absolute;left:0;top:0;background:var(--dark)}
  .hdr-rule{position:absolute;left:0;background:var(--accent)}
  .ftr{position:absolute;left:0;background:var(--dark)}
  .shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(28px)}

  .eyebrow{font:700 24px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .headline{font-family:var(--f-display);font-weight:850;font-stretch:112%;font-size:88px;line-height:.95;letter-spacing:-.005em;
    text-transform:uppercase;color:var(--text)}
  .headline.headline--long{font-size:72px}
  .hdr-title{font-family:var(--f-display);font-weight:850;font-stretch:112%;line-height:1;letter-spacing:-.005em;text-transform:uppercase;
    color:var(--cream);white-space:nowrap}
  .lbl-title{font-family:var(--f-display);font-weight:720;font-stretch:108%;font-size:44px;line-height:1;letter-spacing:.005em;
    text-transform:uppercase;color:var(--text);text-wrap:balance}
  .lbl-body{font:500 30px/1.22 var(--f-text);color:color-mix(in srgb, var(--text) 84%, transparent);text-wrap:pretty}
  .disclaimer{font:400 22px/1.3 var(--f-text);color:var(--text);opacity:.7}
  .ftr-text{font:400 22px/1.3 var(--f-text);color:var(--cream);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* header badge (band frame): outlined box, big numeral + accent unit + sub, all in the display face (one family per page) */
  .badge{position:absolute;border:5px solid rgba(244,239,227,.82)}
  .badge-v{font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:120px;line-height:.84;letter-spacing:-.02em;color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge-u{font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:46px;line-height:1;color:var(--accent);text-transform:uppercase;white-space:nowrap}
  .badge-s{font-family:var(--f-display);font-weight:700;font-stretch:108%;font-size:30px;line-height:1;color:var(--cream);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}

  #canvas[lang=zh] .eyebrow{letter-spacing:.12em;font-weight:700}
  #canvas[lang=zh] .headline{font-family:var(--f-cjk);font-weight:900;font-stretch:100%;font-size:92px;line-height:1.12;letter-spacing:0;text-transform:none}
  #canvas[lang=zh] .headline.headline--long{font-size:76px}
  #canvas[lang=zh] .headline.headline--short{font-size:120px;line-height:1.1}
  #canvas[lang=zh] .hdr-title{font-family:var(--f-cjk);font-weight:900;font-stretch:100%;text-transform:none;letter-spacing:.02em}
  #canvas[lang=zh] .lbl-title{font-family:var(--f-cjk);font-weight:700;font-stretch:100%;font-size:44px;line-height:1.18;letter-spacing:.01em;text-transform:none}
  #canvas[lang=zh] .lbl-body{font-weight:500;font-size:30px;line-height:1.36}
  #canvas[lang=zh] .badge-u,#canvas[lang=zh] .badge-s{font-family:var(--f-cjk);text-transform:none;letter-spacing:0}
  .hero{}
</style></head>
<body><div id="canvas"></div>
<script src="engine/runtime.js"></script>
<script>
(function(){
const T = TPL, job = T.job, W = T.W, H = T.H;
T.init();
const zh = (job.lang || 'en') === 'zh';
const G = 8;
const m = job.safe_margin ?? 72;                         // text margin
const demoH = job.demo ? 40 : 0;
const frame = ['light', 'band', 'plain'].includes(job.frame) ? job.frame : 'light';
const hero = T.asset(job.hero);
const feats = (job.features || []).slice(0, 4);
if ((job.features || []).length > 4) T.notes.push('more than 4 features: only the first 4 are called out (split the rest onto another image)');
const plain = s => T.plain(s);
const lineRects = e => { const rg = document.createRange(); rg.selectNodeContents(e); return [...rg.getClientRects()].filter(q => q.width > 0 && q.height > 0); };
const lineCount = e => { let n = 0, bottom = -1e9; for (const q of lineRects(e).sort((a, b) => a.top - b.top)) { const mid = (q.top + q.bottom) / 2; if (mid > bottom) { n++; bottom = q.bottom; } else bottom = Math.max(bottom, q.bottom); } return n; };
const inkBox = e => { const qs = lineRects(e); const b = T.rect(e); if (!qs.length) return b; const x0 = Math.min(...qs.map(q => q.left)), x1 = Math.max(...qs.map(q => q.right)); return {x: x0, y: b.y, w: x1 - x0, h: b.h}; };
T.layoutInfo = {mode: job.mode || 'auto', frame};

/* ---------------- frame ---------------- */
let bodyTop, bodyBottom, notch = null, footTop = H - demoH;
if (frame === 'plain') T.el('div', {class: 'ground-studio'});
const split = frame === 'light' ? T.el('div', {class: 'ground-split', 'data-exempt': '1'}) : null;
if (frame === 'light') {
  const s = T.el('div', {class: 'strip', 'data-qa': 'accent_strip', 'data-kind': 'shape', 'data-exempt': '1'}); T.box(s, 0, 0, W, 8);
  bodyTop = 8; bodyBottom = H - demoH;
} else if (frame === 'band') {
  const hh = job.header_h ?? (job.badge ? 232 : 200), rule = 14, fh = 72;   // a badge gets a deeper band so it clears the 60px edge zone
  const h0 = T.el('div', {class: 'hdr', 'data-qa': 'header_band', 'data-kind': 'shape', 'data-exempt': '1'}); T.box(h0, 0, 0, W, hh);
  const r0 = T.el('div', {class: 'hdr-rule', 'data-qa': 'header_rule', 'data-kind': 'shape', 'data-exempt': '1'}); T.box(r0, 0, hh, W, rule);
  footTop = H - demoH - fh;
  const f0 = T.el('div', {class: 'ftr', 'data-qa': 'footer_band', 'data-kind': 'shape', 'data-exempt': '1'}); T.box(f0, 0, footTop, W, fh);
  if (job.disclaimer) {
    const d = T.text('disclaimer', plain(job.disclaimer), m, 0, W - 2 * m, 'ftr-text', {tier: 'meta', maxLines: 1});
    d.setAttribute('data-exempt', '1');   // sits in the footer band like the frame itself (inside the 60px edge zone by design)
    d.style.top = (footTop + (fh - T.rect(d).h) / 2) + 'px';
  }
  bodyTop = hh + rule; bodyBottom = footTop;
  // header content: a badge (job.badge) or, without one, the headline set as one cream line
  const hdrMid = hh / 2;
  if (job.badge) {
    const b = typeof job.badge === 'object' ? job.badge : {value: String(job.badge)};
    const box = T.el('div', {class: 'badge', 'data-qa': 'badge', 'data-kind': 'shape', 'data-allow': 'badge_v,badge_u,badge_s'});
    const v = T.text('badge_v', String(b.value ?? b.text ?? ''), 0, 0, null, 'badge-v', {tier: 'headline', maxLines: 1, allow: ['badge']});
    v.style.width = 'auto';
    const vr = T.rect(v), padX = 26, gap = 12;
    const bh = Math.min(136, hh - 40), by = hdrMid - bh / 2, bx = m;
    v.style.left = (bx + padX) + 'px'; v.style.top = (by + (bh - vr.h) / 2 + 2) + 'px';
    let right = bx + padX + vr.w;
    if (b.unit) { const u = T.text('badge_u', String(b.unit), right + gap, by + 20, null, 'badge-u', {tier: 'important', maxLines: 1, allow: ['badge']}); u.style.width = 'auto'; right = Math.max(right, right + gap + T.rect(u).w); }
    if (b.sub) { const s = T.text('badge_s', String(b.sub), bx + padX + vr.w + gap, 0, null, 'badge-s', {tier: 'secondary', maxLines: 1, allow: ['badge']}); s.style.width = 'auto'; s.style.top = (by + bh - 20 - T.rect(s).h) + 'px'; right = Math.max(right, bx + padX + vr.w + gap + T.rect(s).w); }
    T.box(box, bx, by, right + padX - bx, bh);
    // the rest of the band carries the headline, right-aligned on one line, when it fits at 40px or more
    if (job.headline && job.show_headline !== false && job.badge_headline !== false) {
      const x0 = right + padX + 56, wAv = W - m - x0;
      let txt = String(job.headline); if (zh) txt = txt.replace(/[，、；：,;:]\s*\n/g, '\n');
      if (wAv > 300) {
        // one line from 60px down to 40px; else the written two lines (white-space: pre-line) from 52px down to 40px
        const one = txt.replace(/\s*\n\s*/g, zh ? '' : ' ');
        let e = T.text('headline', one, x0, 0, wAv, 'hdr-title', {tier: 'headline', maxLines: 1, align: 'right'});
        const fits = () => e.scrollWidth <= e.clientWidth + 1 && T.rect(e).h <= hh - 2 * m + 24;
        let fs = 60; e.style.fontSize = fs + 'px';
        while (!fits() && fs > 40) { fs -= 4; e.style.fontSize = fs + 'px'; }
        if (!fits() && /\n/.test(txt)) {
          e.remove(); e = T.text('headline', txt.trim(), x0, 0, wAv, 'hdr-title', {tier: 'headline', maxLines: 2, align: 'right'});
          e.style.whiteSpace = 'pre-line'; e.style.lineHeight = '1.05';
          fs = 52; e.style.fontSize = fs + 'px';
          while (!fits() && fs > 40) { fs -= 4; e.style.fontSize = fs + 'px'; }
        }
        if (!fits()) { e.remove(); T.notes.push('headline does not fit beside the badge; band shows the badge only'); }
        else e.style.top = (hdrMid - T.rect(e).h / 2) + 'px';
      }
    }
  } else if (job.headline && job.show_headline !== false) {
    const txt = String(job.headline).replace(/\s*\n\s*/g, zh ? '' : ' ');
    const e = T.text('headline', txt, m, 0, W - 2 * m, 'hdr-title', {tier: 'headline', maxLines: 1});
    let fs = 72; e.style.fontSize = fs + 'px';
    while (e.scrollWidth > e.clientWidth + 1 && fs > 44) { fs -= 4; e.style.fontSize = fs + 'px'; }
    e.style.top = (hdrMid - T.rect(e).h / 2) + 'px';
  }
}
if (frame !== 'band') {
  bodyTop = frame === 'light' ? 8 : 0; bodyBottom = H - demoH;
  // headline notch, top-left: eyebrow + h1
  const headW = Math.round(W * (zh ? 0.56 : 0.62));
  let y = m;
  const parts = [];
  if (job.eyebrow) { const e = T.text('eyebrow', job.eyebrow, m, y, headW, 'eyebrow', {tier: 'meta', maxLines: 1}); parts.push(e); y += T.rect(e).h + 3 * G; }
  if (job.headline && job.show_headline !== false) {
    // two-tone (P5): without markup of its own, a written two-line headline sets its first line in the accent
    let htxt = String(job.headline);
    if (zh) htxt = htxt.replace(/[，、；：,;:]\s*\n/g, '\n');     // a clause mark does not hang at a line break
    if (job.two_tone !== false && !/\[\[|\{/.test(htxt) && /\n/.test(htxt.trim())) { const k = htxt.indexOf('\n'); htxt = '[[' + htxt.slice(0, k).trim() + ']]\n' + htxt.slice(k + 1).trim(); }
    const hl = T.text('headline', htxt, m, y, headW, 'headline', {tier: 'headline', maxLines: 2});
    if (lineCount(hl) > 2) { hl.classList.add('headline--long'); T.notes.push('headline used the compact step (72px)'); }
    else if (zh && Math.max(...T.plain(htxt).split('\n').map(l => l.trim().length)) <= 6) {
      hl.classList.add('headline--short');               // a short zh headline is set larger so it holds its corner
      if (lineCount(hl) > 2 || hl.scrollWidth > hl.clientWidth + 1) hl.classList.remove('headline--short');
    }
    parts.push(hl);
    if (job._lines === 'stock') T.notes.push('headline is a stock line (fallback copy); a product-data headline reads stronger');
  }
  if (parts.length) {
    const bs = parts.map(inkBox);
    const x1 = Math.max(...bs.map(b => b.x + b.w)), y1 = Math.max(...bs.map(b => b.y + b.h));
    notch = {x: m, y: m, w: x1 - m, h: y1 - m};
  }
}
// disclaimer on light / plain frames: one or two small lines on the bottom edge
let discTop = bodyBottom;
if (frame !== 'band' && job.disclaimer) {
  const d = T.text('disclaimer', plain(job.disclaimer), m, 0, W - 2 * m, 'disclaimer', {tier: 'meta', maxLines: 2});
  const dh = T.rect(d).h; d.style.top = (H - demoH - 62 - dh) + 'px'; discTop = H - demoH - 62 - dh;
}

/* ---------------- labels: build once, measure ---------------- */
const lw = Math.round(job.label_width ?? Math.min(420, W * 0.35));    // wide enough that a two-word title stays on one line
const lwMax = Math.round(Math.min(500, W * 0.38));
const insetR = Math.round(job.inset_r ?? (W >= 1400 ? 140 : 124));
const ringPad = 12;
let insetsLeft = 2;
const labels = feats.map((f, i) => {
  const id = 'lbl' + (i + 1);
  const inset = !!(f.detail_asset && (job.assets || {})[f.detail_asset] && insetsLeft-- > 0);
  const top0 = inset ? 2 * insetR + 2 * ringPad + 3 * G : 0;
  const t = T.text(id + '_title', f.title, m, top0, lw, 'lbl-title', {tier: 'important', maxLines: 3});
  // a title that would stack 3+ lines gets a wider column (up to lwMax) when that saves a line
  let lwi = lw;
  if (job.label_width == null && lineCount(t) >= 3) { t.style.width = lwMax + 'px'; if (lineCount(t) < 3) lwi = lwMax; else t.style.width = lw + 'px'; }
  let bottom = T.rect(t).y + T.rect(t).h, body = null; const hT = bottom;
  let wT = 0; for (const q of lineRects(t)) wT = Math.max(wT, q.right - m);
  if (f.body && !inset) { body = T.text(id + '_body', zh ? f.body : String(f.body).replace(/(\w)-(\w)/g, '$1\u2011$2'), m, bottom + 1.5 * G, lwi, 'lbl-body', {tier: 'secondary', maxLines: 2}); bottom = T.rect(body).y + T.rect(body).h; }
  const firstLine = lineRects(t).sort((a, b) => a.top - b.top)[0];
  const tOff = firstLine ? (firstLine.top + firstLine.bottom) / 2 : top0 + 22;
  let textW = 0; for (const e of [t, body]) if (e) for (const q of lineRects(e)) textW = Math.max(textW, q.right - m);
  const wInk = Math.max(Math.min(lwi, Math.ceil(textW)), inset ? 2 * insetR + 2 * ringPad : 0);
  if (lineCount(t) > 3 || (body && lineCount(body) > 2)) T.notes.push(id + ' copy is longer than the label budget');
  // the leader stops just short of the first title line's ink (ragged edge), not of the block's widest line
  const fw = firstLine ? Math.ceil(firstLine.right - firstLine.left) : wInk;
  const wTi = Math.max(Math.min(lwi, Math.ceil(wT)), inset ? 2 * insetR + 2 * ringPad : 0);
  return {id, f, i, t, body, lw: lwi, inset, top0, h: bottom, tOff, w: wInk, fw: inset ? wInk : Math.min(wInk, fw), hFull: bottom, wFull: wInk, hT, wT: wTi};
});

/* ---------------- product geometry ---------------- */
const theta = (job.hero_rotate_deg || 0) * Math.PI / 180;
const cb = hero.content_bbox || [0, 0, 1, 1];
const hullN = hero.hull || [[cb[0], cb[1]], [cb[2], cb[1]], [cb[2], cb[3]], [cb[0], cb[3]]];
const rot = (x, y) => [x * Math.cos(theta) - y * Math.sin(theta), x * Math.sin(theta) + y * Math.cos(theta)];
const cc = hullN.map(([u, v]) => rot((u - 0.5) * hero.width, (v - 0.5) * hero.height));
const bx0 = Math.min(...cc.map(p => p[0])), bx1 = Math.max(...cc.map(p => p[0])), by0 = Math.min(...cc.map(p => p[1])), by1 = Math.max(...cc.map(p => p[1]));
const cW = bx1 - bx0, cH = by1 - by0;
const inPoly = (poly, p) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
const rectHitsPoly = (poly, r, pad) => {
  const x0 = r.x - pad, y0 = r.y - pad, x1 = r.x + r.w + pad, y1 = r.y + r.h + pad;
  for (const p of poly) if (p[0] > x0 && p[0] < x1 && p[1] > y0 && p[1] < y1) return true;
  if (inPoly(poly, [x0, y0]) || inPoly(poly, [x1, y0]) || inPoly(poly, [x1, y1]) || inPoly(poly, [x0, y1])) return true;
  const rr = {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) if (T.segRect(poly[j], poly[i], rr, 0)) return true;
  return false;
};
const overPoly = (poly, a, b) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / 8)); let k = 0; for (let s = 0; s < n; s++) { const t = (s + 0.5) / n; if (inPoly(poly, [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t])) k++; } return L * k / n; };
const distSeg = (p, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1]; const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1))); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); };
const rectsHit = (a, b, gx, gy) => a.x < b.x + b.w + gx && a.x + a.w > b.x - gx && a.y < b.y + b.h + gy && a.y + a.h > b.y - gy;

// the box the product may use (edges at m/2), the bottom kept clear of the disclaimer / footer
const px0 = m * 0.5, px1 = W - m * 0.5;
const py0 = bodyTop + (frame === 'band' ? 3 * G : m * 0.5);
const py1 = Math.min(bodyBottom, discTop) - (frame === 'band' ? 4 * G : m * 0.5);
const fill = job.hero_fill ?? 1.15;
const targetH = Math.min(py1 - py0, H * 0.62 * fill);
const s0 = Math.min(targetH / cH, (px1 - px0) / cW, 1.25);
const labTop = (frame === 'band' ? bodyTop + 6 * G : m);
const labBot = Math.min(bodyBottom - (frame === 'band' ? 5 * G : m), discTop - 3 * G) ;

function placement(sf, ax, ay) {
  const s = s0 * sf, w = cW * s, h = cH * s;
  const cX = px0 + (px1 - px0 - w) * ax - bx0 * s, cY = py0 + (py1 - py0 - h) * ay - by0 * s;
  const P = (u, v) => { const q = rot((u - 0.5) * hero.width * s, (v - 0.5) * hero.height * s); return [cX + q[0], cY + q[1]]; };
  const hull = hullN.map(([u, v]) => P(u, v));
  return {s, sf, ax, ay, cX, cY, P, hull, cbox: {x: cX + bx0 * s, y: cY + by0 * s, w, h}, anchors: feats.map(f => P(f.anchor[0], f.anchor[1]))};
}

/* ---------------- label slot search ---------------- */
function solve(pl) {
  if (notch && rectHitsPoly(pl.hull, notch, 28)) return null;
    const sideOK = {};          // cache label rect vs product per (label, side, y)
  const candidates = labels.map((L, i) => {
    const out = [], a = pl.anchors[i];
    const ys = []; for (let y = labTop; y + L.h <= labBot; y += G) ys.push(y);
    const yA = Math.round((a[1] - L.tOff) * 10) / 10; if (yA >= labTop && yA + L.h <= labBot) ys.push(yA);
    for (const side of ['L', 'R']) for (const y of ys) {
      const x = side === 'L' ? m : W - m - L.w;
      const rect = {x, y, w: L.w, h: L.h};
      if (rectHitsPoly(pl.hull, rect, 28)) continue;
      if (notch && rectsHit(rect, notch, 64, 56)) continue;     // clear of the headline; beside it is allowed
      const ty = y + L.tOff;
      const inner = side === 'L' ? x + L.w : x;          // inner edge of the text block
      const innerT = side === 'L' ? m + L.fw : W - m - L.fw;   // inner edge of the first title line
      const dir = side === 'L' ? 1 : -1;
      // side port, at the first title line
      const ps = [innerT + dir * 22, ty];
      if ((a[0] - ps[0]) * dir > 24) {
        const straight = Math.abs(a[1] - ty) < 0.5;
        const pts = straight ? [ps, a] : [ps, [a[0], ps[1]], a];
        out.push({side, y, rect, pts, end: a, bends: straight ? 0 : 1});
      }
      { const inkX0 = x, inkX1 = x + L.w;
        if (a[0] >= inkX0 + 24 && a[0] <= inkX1 - 24) {
          if (a[1] < y - 92) out.push({side, y, rect, pts: [[a[0], y - 20], a], end: a, bends: 0, vport: true, drop: true});
          if (a[1] > y + L.h + 92) out.push({side, y, rect, pts: [[a[0], y + L.h + 20], a], end: a, bends: 0, vport: true, drop: true});
        } }
      // top / bottom port, near the inner end of the label: vertical run then horizontal into the part
      const rx = inner - dir * 30;
