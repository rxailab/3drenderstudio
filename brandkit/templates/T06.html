<!doctype html>
<html><head><meta charset="utf-8">
<!--INJECT-->
<link rel="stylesheet" href="engine/base.css">
<style>
  /* T06 · dimensions: the product large on a studio-light ground, dimension lines in ink, each value in an accent pill;
     the figures headline names its axes (W × D × H); a size the face-on view hides is drawn on the product turned a quarter
     (job.end, same scale), never on a schematic box; only the sizes the job gives; optional light spec table;
     one disclaimer microline. One display family (Archivo): extended for the headline, narrow for the figures. */
  #canvas{--bg:#F5F5F2;--text:#1E2226;--muted:#5E666D;--accent:#2C4C8C;--line:var(--text);--wm:rgba(0,0,0,.045);
    --acc-small:color-mix(in srgb,var(--accent) 70%,#000);
    background:radial-gradient(120% 90% at 60% 55%,#FFFFFF 0%,var(--bg) 72%)}
  .kick{position:absolute;background:var(--accent)}
  #canvas.acc-light .eyebrow{color:var(--muted)}
  .eyebrow{font:700 26px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--acc-small);white-space:nowrap}
  .headline{font-family:var(--f-display);font-weight:850;font-stretch:114%;font-size:88px;line-height:.95;letter-spacing:-.005em;
    text-transform:uppercase;color:var(--text);text-wrap:balance}
  .headline.compact{font-size:72px}
  /* axis names under the headline figures */
  .hlkey{font:700 22px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  /* value pill: the figure in narrow Archivo, the other unit lighter; .stack puts the other unit under it (vertical lines) */
  .d-lab{font-family:var(--f-display);font-weight:800;font-stretch:90%;font-size:52px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;
    letter-spacing:-.005em;background:var(--accent);color:var(--accent-ink,#fff);border-radius:999px;padding:11px 26px 10px;transform-origin:50% 50%}
  .d-lab.sm{font-size:50px;padding:9px 22px 8px}
  .d-lab .alt{font-weight:600;font-size:.6em;opacity:.88;letter-spacing:0}
  .d-lab.stack{display:flex;flex-direction:column;align-items:center;border-radius:20px;padding:14px 22px 12px}
  .d-lab.stack .alt{font-size:.58em;margin-top:7px}
  .d-lab .nm{font-family:var(--f-text);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-right:.7em;vertical-align:.5em;opacity:.9}
  .dim{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:butt}
  .ext{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 7;opacity:.45}
  .arrow{fill:var(--line)}
  .tick{fill:none;stroke:var(--line);stroke-width:3}
  .shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(28px)}
  /* spec table (light): white card, 1px rules, full-height dividers, figures in ink */
  .tbl{position:absolute;border-radius:14px;overflow:hidden;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(30,34,38,.16)}
  .tbl .hrule{position:absolute;left:0;right:0;height:1px;background:rgba(30,34,38,.14)}
  .tbl .sep{position:absolute;width:1px;background:rgba(30,34,38,.14)}
  .th{font:700 22px/1.05 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
  .td{font-family:var(--f-display);font-weight:800;font-stretch:90%;font-size:52px;line-height:1;color:var(--text);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  .td .u{font-size:.55em;font-weight:700;margin-left:.12em}
  .td-alt{font:500 24px/1 var(--f-text);color:var(--muted);text-align:center;white-space:nowrap}
  .disc{font:400 24px/1.3 var(--f-text);color:var(--muted);white-space:nowrap}
  #canvas[lang=zh] .eyebrow{font-family:var(--f-cjk);font-weight:700;letter-spacing:0;font-size:28px}
  #canvas[lang=zh] .headline{font-family:var(--f-cjk);font-weight:900;font-stretch:100%;font-size:92px;line-height:1.12;letter-spacing:.01em;text-transform:none;text-wrap:wrap}
  #canvas[lang=zh] .headline.compact{font-size:76px}
  /* figures headline: tabular figures, unit lowercase in the accent; zh keeps the Latin display face for the figures */
  .headline.dimhl{font-variant-numeric:tabular-nums;white-space:nowrap}
  .headline.dimhl .hi{text-transform:none}
  #canvas[lang=zh] .headline.dimhl{font-family:var(--f-display);font-weight:850;font-stretch:114%;font-size:88px;line-height:.95;letter-spacing:-.005em}
  #canvas[lang=zh] .hlkey,#canvas[lang=zh] .th{font-family:var(--f-cjk);font-weight:700;letter-spacing:.04em;font-size:24px}
  #canvas[lang=zh] .d-lab .nm{font-family:var(--f-cjk);letter-spacing:.04em;font-size:22px;vertical-align:.3em}
  #canvas[lang=zh] .td-alt,#canvas[lang=zh] .disc{font-family:var(--f-cjk)}
  #canvas[lang=zh] .d-lab .v,#canvas[lang=zh] .d-lab .alt,#canvas[lang=zh] .td{font-family:var(--f-display)}
</style></head>
<body><div id="canvas"></div>
<script src="engine/runtime.js"></script>
<script>
(function(){
const T = TPL, job = T.job, W = T.W, H = T.H;
T.init();
const zh = (job.lang || 'en') === 'zh';
const G = 8, bandH = job.demo ? 40 : 0, cap = 1.25, u = Math.min(1, W / 1500);
const m = Math.max(job.min_margin ?? 60, job.text_margin ?? 72);     // text margin (brief: 72)
const mode = job.mode || 'onproduct';
const hero = T.asset(job.hero), cb = hero.content_bbox || [0, 0, 1, 1];
const dims = (job.dimensions || []).filter(d => d && d.value != null && d.from && d.to).slice(0, 4);
T.layoutInfo = {mode};

/* --accent-ink from the accent's luminance when the palette does not carry it */
(function(){
  const pal = job.palette || {};
  const hx = String(getComputedStyle(T.root).getPropertyValue('--accent')).trim().replace('#', '');
  if (!/^[0-9a-f]{6}$/i.test(hx)) return;
  const c = [0, 2, 4].map(i => parseInt(hx.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  const L = .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  if (L > .4) T.root.classList.add('acc-light');      // a light accent is too faint for small type on the light ground
  if (!pal['accent-ink']) T.root.style.setProperty('--accent-ink', L > .4 ? '#111111' : '#FFFFFF');
})();

/* explicit unit conversion with declared rounding (never measured from the photo) */
const r1 = v => String(Math.round(v * 10) / 10);
function convert(d) {
  // the seller's own figure in the other system ("200 mm (8 in)"), when they gave one
  if (d.alt && d.alt.value != null && d.alt.unit) return {v: String(+d.alt.value), u: d.alt.unit, rule: 'as stated'};
  const v = +d.value;
  if (d.unit === 'in') return {v: r1(v * 2.54), u: 'cm', rule: 'in→cm ×2.54, rounded to 0.1 cm'};
  if (d.unit === 'cm') return {v: r1(v / 2.54), u: 'in', rule: 'cm→in ÷2.54, rounded to 0.1 in'};
  if (d.unit === 'mm') return {v: r1(v / 25.4), u: 'in', rule: 'mm→in ÷25.4, rounded to 0.1 in'};
  return null;
}
T.layoutInfo.conversions = dims.map(d => ({key: d.key, rule: (convert(d) || {}).rule || null}));

/* job.end: the same product turned a quarter ({asset, scale, at: "right" | "below", dimensions}), for a size the main view
   hides (a toolbox's depth, the thickness of pliers lying flat). There is no drawn box: a size is only ever shown on the product. */
const endV = job.end && job.end.asset && (job.end.dimensions || []).length ? job.end : null;
const endAsset = endV ? T.asset(endV.asset) : null;
const endDims = endV ? endV.dimensions.filter(d => d && d.value != null && d.from && d.to).slice(0, 2) : [];
const allDims = dims.concat(endDims);
let note = job.table_note ? String(job.table_note) : '';
note = note.replace(/\s+/g, ' ').trim();
/* one disclaimer pattern for every variant: '<source>; please allow 1–2 cm variance.' / '<来源>，存在 1–2 cm 误差'.
   No measurement method is claimed unless the job states one. job.variance: a range string, or false to drop the clause. */
const unit0 = (allDims[0] || {}).unit || 'cm';
const variance = job.variance === false ? '' : String(job.variance || (unit0 === 'in' ? '0.5–1 in' : '1–2 cm'));
const tidy = s => String(s).replace(/(\d)\s*[-~～]\s*(\d)/g, '$1–$2').replace(/(\d)(mm|cm|in)\b/g, '$1 $2').replace(/\s+/g, ' ').trim();
function buildDisclaimer() {
  if (job.disclaimer != null) return tidy(job.disclaimer);
  const src = note.replace(/[.。;；,，\s]+$/, '');
  if (zh) return tidy((src || '尺寸为近似值') + (variance ? '，存在 ' + variance + ' 误差' : '。'));
  if (!variance) return tidy((src || 'Sizes are approximate') + '.');
  return tidy(src ? src + '; please allow ' + variance + ' variance.' : 'Sizes are approximate; please allow ' + variance + ' variance.');
}
const disclaimer = buildDisclaimer();

/* ---------- header: accent kick, eyebrow, headline ---------- */
let y = m;
T.box(T.el('div', {class: 'kick'}), m, y, 64, 8); y += 8 + 3 * G;
/* P3: a stock headline ('Overall size' / '外形尺寸') gives way to the figures themselves, number first
   ('40.5 × 18 × 47.6 cm', width × depth × height, each figure named underneath); the stock phrase moves into the eyebrow.
   job.headline_dims: 'stock' (default: only when the headline is a stock phrase or missing), true (always), false (never). */
const stockRe = /^\s*(overall\s+(size|dimensions?)|dimensions?|sizes?|product\s+(size|dimensions?)|size\s+chart|外形尺寸|产品尺寸|尺寸(参数|规格)?|规格尺寸)\s*[.。]?\s*$/i;
const pick = k => allDims.find(d => d.key === k);
/* one order everywhere: length-or-width × depth-or-thickness (or the width after a length) × height */
const first = pick('length') || pick('width');
const order = [first, pick('depth') || pick('thickness') || (first && first.key === 'length' ? pick('width') : null), pick('height')].filter(Boolean);
let headText = job.headline, eyeText = job.eyebrow, dimHead = false, seq = [];
(function(){
  const hd = job.headline_dims ?? 'stock';
  const isStock = !headText || stockRe.test(T.plain(headText));
  if (hd === false || (hd === 'stock' && !isStock)) return;
  if (order.length < 2) return;
  const un = order[0].unit;
  if (!un || order.some(d => d.unit !== un)) return;
  seq = order;
  headText = seq.map(d => d.value).join(' × ') + ' [[' + un + ']]';
  dimHead = true;
  if (job.headline && isStock) eyeText = eyeText ? T.plain(eyeText) + (zh ? '·' : ' · ') + T.plain(job.headline) : job.headline;
  T.notes.push('headline: stock phrase replaced by the figures (' + T.plain(headText) + ')');
})();
if (eyeText) {
  let e = T.text('eyebrow', eyeText, m, y, W - 2 * m, 'eyebrow', {tier: 'meta', maxLines: 1});
  if (e.scrollWidth > e.clientWidth + 1 && job.eyebrow && eyeText !== job.eyebrow) { e.remove(); e = T.text('eyebrow', job.eyebrow, m, y, W - 2 * m, 'eyebrow', {tier: 'meta', maxLines: 1}); }
  y += T.rect(e).h + 2 * G;
}
const hl = T.text('headline', headText, m, y, W - 2 * m, 'headline' + (dimHead ? ' dimhl' : ''), {tier: 'headline', maxLines: 2});
const lineCount = e => { const rg = document.createRange(); rg.selectNodeContents(e); return new Set([...rg.getClientRects()].filter(q => q.width > 0).map(q => Math.round(q.top))).size; };
if (lineCount(hl) > 1 && !zh) hl.classList.add('compact');
if (dimHead) {   // one line of figures: step down to the compact size, then shrink, never wrap
  if (hl.scrollWidth > hl.clientWidth + 1) hl.classList.add('compact');
  let fs = parseFloat(getComputedStyle(hl).fontSize);
  while (hl.scrollWidth > hl.clientWidth + 1 && fs > 56) { fs -= 2; hl.style.fontSize = fs + 'px'; }
}
y = T.rect(hl).y + T.rect(hl).h;
/* name each headline figure underneath (WIDTH / DEPTH / HEIGHT), so the order reads without guessing */
if (dimHead && job.headline_keys !== false) {
  const tn = [...hl.childNodes].find(n => n.nodeType === 3);
  const spans = [];
  let at = 0;
  for (const d of seq) {
    const sv = String(d.value), i = tn ? tn.data.indexOf(sv, at) : -1;
    if (i < 0) { spans.length = 0; break; }
    const rg = document.createRange(); rg.setStart(tn, i); rg.setEnd(tn, i + sv.length);
    const q = rg.getBoundingClientRect(); spans.push({x0: q.left, x1: q.right}); at = i + sv.length;
  }
  if (spans.length === seq.length) {
    const ky = y + 14;
    const make = full => seq.map((d, i) => {
      const txt = full ? T.plain(d.name || d.key) : (zh ? T.plain(d.name || '').slice(0, 1) : String(d.key || '').slice(0, 1).toUpperCase());
      const e = T.text('hl_k' + (i + 1), txt, 0, ky, 10, 'hlkey', {tier: 'meta', maxLines: 1});
      e.style.width = 'auto';
      const w = Math.ceil(e.getBoundingClientRect().width) + 2, cx = (spans[i].x0 + spans[i].x1) / 2;
      const x = Math.max(m, Math.min(W - m - w, cx - w / 2));
      e.style.width = w + 'px'; e.style.left = x + 'px';
      return {e, x0: x, x1: x + w};
    });
    let ks = make(true);
    if (ks.some((k, i) => i && k.x0 < ks[i - 1].x1 + 16)) { ks.forEach(k => k.e.remove()); ks = make(false); }
    y = ky + Math.max(...ks.map(k => T.rect(k.e).h));
  }
}

/* value pills (measured once; placed by the fit below) */
function pill(id, d, o = {}) {
  // a shape (the pill) holding one text element per run, so a turned pill still measures as one line
  const ids = [id, id.replace(/_val$/, '_alt'), id.replace(/_val$/, '_name')];
  const e = T.el('div', {class: 'd-lab' + (o.size ? ' ' + o.size : '') + (o.stack ? ' stack' : ''), 'data-qa': id.replace(/_val$/, '_pill'), 'data-kind': 'shape', 'data-allow': ids.join(',')});
  e.style.position = 'absolute';
  const run = (qid, cls, text, tier) => T.el('span', {class: 'txt ' + cls, 'data-qa': qid, 'data-kind': 'text', 'data-tier': tier, 'data-maxlines': '1',
    'data-allow': [e.dataset.qa].concat(ids.filter(x => x !== qid)).join(',')}, e, text);
  if (o.name) run(ids[2], 'nm', T.plain(d.name), 'meta');
  run(ids[0], 'v', `${d.value} ${d.unit}`, 'important');
  const c = convert(d);
  if (c) run(ids[1], 'alt', (o.stack ? '' : ' / ') + `${c.v} ${c.u}`, 'meta');
  return {el: e, w: e.offsetWidth, h: e.offsetHeight, stack: !!o.stack};
}

const headerBottom = y;

/* ---------- footer: disclaimer microline, light spec table above it ---------- */
const floor = H - bandH - 62;
let bottom = floor;
if (disclaimer) {
  const dc = T.text('disclaimer', disclaimer, m, 0, W - 2 * m, 'disc', {tier: 'meta', maxLines: 1});
  const h = T.rect(dc).h; dc.style.top = (floor - h) + 'px'; bottom = floor - h - 3 * G;
}
if (mode === 'table') {
  /* the table carries only what the drawing does not already show (job.table_all: true lists W/D/H too, in the headline order) */
  const drawn = new Set(allDims);
  const figs = order.concat(allDims.filter(d => !order.includes(d)));
  const cols = figs.filter(d => job.table_all || !drawn.has(d)).map(d => ({name: d.name, value: d.value, unit: d.unit, d}));
  for (const s of (job.specs || [])) if (s && s.name && s.value != null) cols.push({name: s.name, value: s.value, unit: s.unit || '', d: s});
  const n = Math.min(6, cols.length);
  if (!n) T.notes.push('table: every figure is already on the drawing, table left out');
  if (n) {
    const tw = W - 2 * m, cw = tw / n, hh = 52, vh = 108, th = hh + vh, ty = bottom - th;
    const ids = [];
    cols.slice(0, n).forEach((_, i) => ids.push('t' + (i + 1) + '_name', 't' + (i + 1) + '_val', 't' + (i + 1) + '_alt'));
    const tb = T.el('div', {class: 'tbl', 'data-qa': 'spec_table', 'data-kind': 'shape', 'data-allow': ids.join(',')});
    T.box(tb, m, ty, tw, th);
    T.box(T.el('div', {class: 'hrule'}, tb), 0, hh, tw, 1);
    for (let i = 1; i < n; i++) T.box(T.el('div', {class: 'sep'}, tb), Math.round(i * cw), 0, 1, th);
    const shrink = (e, min) => { let fs = parseFloat(getComputedStyle(e).fontSize); while (e.scrollWidth > e.clientWidth + 1 && fs > min) { fs -= 1; e.style.fontSize = fs + 'px'; } };
    cols.slice(0, n).forEach((c, i) => {
      const x = m + i * cw + 12, w = cw - 24;
      const nm = T.text('t' + (i + 1) + '_name', T.plain(c.name), x, 0, w, 'th', {tier: 'meta', maxLines: 1, allow: ['spec_table']});
      shrink(nm, 18);
      nm.style.top = (ty + (hh - T.rect(nm).h) / 2) + 'px';
      const v = T.text('t' + (i + 1) + '_val', '', x, 0, w, 'td', {tier: 'important', maxLines: 1, allow: ['spec_table']});
      v.appendChild(document.createTextNode(String(c.value)));
      if (c.unit) { const un = document.createElement('span'); un.className = 'u'; un.textContent = c.unit; v.appendChild(un); }
      shrink(v, 50);
      const cv = c.d && c.d.unit ? convert(c.d) : null;
      let al = null;
      if (cv) al = T.text('t' + (i + 1) + '_alt', `${cv.v} ${cv.u}`, x, 0, w, 'td-alt', {tier: 'meta', maxLines: 1, allow: ['spec_table']});
      const bh = T.rect(v).h + (al ? T.rect(al).h + 10 : 0), by = ty + hh + (vh - bh) / 2;
      v.style.top = by + 'px'; if (al) al.style.top = (by + T.rect(v).h + 10) + 'px';
    });
    bottom = ty - 4 * G;
  }
}

/* ---------- product + dimension lines (+ the product turned): fit everything into the free region ---------- */
const region = {x: m, y: headerBottom + 4 * G, w: W - 2 * m, h: bottom - headerBottom - 4 * G};
const cw0 = (cb[2] - cb[0]) * hero.width, ch0 = (cb[3] - cb[1]) * hero.height;
const ratio = Math.max(cw0 / ch0, ch0 / cw0), tilt = job.tilt ?? 30;
/* a long product lies on a 25-35° diagonal, rising to the right; with a turned view beside it both stay square to the page,
   as in a drawing, so the shared edge lines up */
const theta = job.rotate != null ? +job.rotate : (!endV && ratio > 2.2 && tilt ? (cw0 >= ch0 ? -tilt : 90 - tilt) : 0);
const th = theta * Math.PI / 180, ct = Math.cos(th), st = Math.sin(th);
const rot = (x, y) => [x * ct - y * st, x * st + y * ct];
/* a line steeper than 45° gets an upright stacked pill (figure over the other unit) beside it; flatter lines a pill turned to the line */
function pillsFor(ds, asset, first, turn) {
  return ds.map((d, i) => {
    const v0 = [(d.to[0] - d.from[0]) * asset.width, (d.to[1] - d.from[1]) * asset.height], v = turn ? rot(v0[0], v0[1]) : v0;
    const a = Math.abs(Math.atan2(v[1], v[0]) * 180 / Math.PI) % 180;
    return pill('d' + (first + i + 1) + '_val', d, {stack: a > 45 && a < 135});
  });
}
function extremesFor(ds, asset) {
  // the hull point furthest out at each end of the line: extension lines start at the real silhouette
  const hull = asset.hull && asset.hull.length > 2 ? asset.hull : null;
  return ds.map(d => {
    const dir = [(d.to[0] - d.from[0]) * asset.width, (d.to[1] - d.from[1]) * asset.height];
    if (!hull) return [d.from, d.to];
    const dot = p => p[0] * asset.width * dir[0] + p[1] * asset.height * dir[1];
    let lo = hull[0], hi = hull[0];
    for (const p of hull) { if (dot(p) < dot(lo)) lo = p; if (dot(p) > dot(hi)) hi = p; }
    return [lo, hi];
  });
}
const labels = pillsFor(dims, hero, 0, true), extremes = extremesFor(dims, hero);
const endLabels = endV ? pillsFor(endDims, endAsset, dims.length, false) : [], endExtremes = endV ? extremesFor(endDims, endAsset) : [];

/* the dimension lines of one view: P maps the view's picture fractions to the page, quad is its content box there */
function linesOf(ds, labs, exs, P, quad, sides, pts) {
  return ds.map((d, i) => {
    const a = P(d.from), b = P(d.to);
    const sv = sides(d.side[0], d.side[1]), sl = Math.hypot(sv[0], sv[1]) || 1, nrm = [sv[0] / sl, sv[1] / sl];
    const off = d.offset ?? job.dim_offset ?? 50;
    // the line runs parallel to a→b, 'off' px outside the content box's extreme point along the normal
    const ex = exs[i].map(P);
    const reach = Math.max(...quad.map(q => (q[0] - a[0]) * nrm[0] + (q[1] - a[1]) * nrm[1]));
    const A = [a[0] + nrm[0] * (reach + off), a[1] + nrm[1] * (reach + off)], B = [b[0] + nrm[0] * (reach + off), b[1] + nrm[1] * (reach + off)];
    // project the silhouette extremes onto the line for the ends
    const uu = [B[0] - A[0], B[1] - A[1]], ul = Math.hypot(uu[0], uu[1]) || 1, ud = [uu[0] / ul, uu[1] / ul];
    const proj = q => { const t = (q[0] - A[0]) * ud[0] + (q[1] - A[1]) * ud[1]; return [A[0] + ud[0] * t, A[1] + ud[1] * t]; };
    const A2 = proj(ex[0]), B2 = proj(ex[1]);
    let ang = Math.atan2(B2[1] - A2[1], B2[0] - A2[0]) * 180 / Math.PI;
    if (ang > 90.5) ang -= 180; if (ang <= -90) ang += 180; if (Math.abs(ang - 90) < 0.6) ang = -90;
    const L = labs[i], gap = 10 + 3;
    if (L.stack) ang = 0;   // upright pill
    const reachL = L.stack ? Math.abs(nrm[0]) * L.w / 2 + Math.abs(nrm[1]) * L.h / 2 : L.h / 2;
    const mid = [(A2[0] + B2[0]) / 2, (A2[1] + B2[1]) / 2];
    const c = [mid[0] + nrm[0] * (gap + reachL), mid[1] + nrm[1] * (gap + reachL)];

const geo = geometry(s, ox, oy);

/* contact shadow under an upright product */

if (!theta) shadowUnder(geo.quad);
if (geo.end && endV.at !== 'below') shadowUnder(geo.end.quad);

if (theta) { img.style.transform = `rotate(${theta}deg)`; img.dataset.rotate = theta; }

T.layoutInfo.hero_rotate = theta;
if (geo.end) {

for (const [k, v] of Object.entries({id: 'arw', viewBox: '0 0 14 14', refX: '13', refY: '7', markerWidth: '14', markerHeight: '14', markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse'})) mk.setAttribute(k, v);

const drawn = geo.lines.map((L, i) => [L, labels[i]]).concat(geo.end ? geo.end.lines.map((L, i) => [L, endLabels[i]]) : []);
drawn.forEach(([L, lab], i) => {
