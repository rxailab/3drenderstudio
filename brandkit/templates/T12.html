<!doctype html>
<html><head><meta charset="utf-8">
<!--INJECT-->
<link rel="stylesheet" href="engine/base.css">
<style>
  /* T12 · hero poster. One product story: a heavy extended-caps headline (two-tone), one support line carrying the
     number, optional figure chips / key stat / platform badge / brand slot / close-up inset. Three modes:
       overlay – full-bleed scene, text on a gradient scrim in the quieter half (default when a scene is given); with
                 job.product_box the scene is moved so the product clears the words, and a scene with no room for
                 them falls back to band
       band    – scene on the top 70%, hard-edged warm-dark band below (the DeWalt variant)
       solid   – studio light ground, product large (may bleed right/bottom), text column top-left. */
  #canvas{--bg:#E9E6E0;--text:#1C1F22;--muted:#4F575E;--accent:#D0612A;--wm:rgba(0,0,0,.045)}
  #canvas.studio{background:linear-gradient(to bottom,rgba(150,112,72,0) 58%,rgba(150,112,72,.13) 100%),radial-gradient(120% 90% at 50% 62%,#FFFFFF 0%,#F7F4EF 40%,var(--bg) 100%)}
  .hl{font-family:var(--f-display);font-weight:900;font-stretch:116%;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;color:var(--ink);text-wrap:balance}
  .on-dark .hl{color:var(--cream)}
  .on-dark .txt .hi{color:var(--accent-hi,var(--accent))}
  .on-photo .hl,.on-photo .sub{text-shadow:0 2px 14px rgba(0,0,0,.35)}
  .on-dark.on-photo .txt .hi{color:var(--accent-photo,var(--accent-hi,var(--accent)))}
  .sub{font-family:var(--f-display);font-weight:500;font-stretch:100%;text-transform:none;letter-spacing:0;line-height:1.16;color:var(--ink-2,#3A3A3A);text-wrap:balance}
  .on-dark .sub{color:rgba(244,239,227,.86)}
  #canvas[lang=zh] .txt.hl{font-family:var(--f-cjk);font-weight:900;font-stretch:100%;text-transform:none;letter-spacing:.01em;line-height:1.12;text-wrap:wrap}
  #canvas[lang=zh] .txt.sub{font-family:var(--f-cjk);font-weight:500;text-transform:none;letter-spacing:.02em;line-height:1.36}
  .rule{position:absolute;background:var(--accent)}
  .band{position:absolute;background:var(--band,#211915)}
  .seam{position:absolute;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--band,#211915))}
  .band-hair{position:absolute;background:rgba(255,255,255,.14)}
  .shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.20),rgba(0,0,0,.08) 60%,rgba(0,0,0,0));filter:blur(14px)}
  .slot{position:absolute;border:3px solid rgba(127,127,127,.55);border-radius:8px}
  .on-dark .slot{border-color:rgba(244,239,227,.38)}
  .slot-t{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:30px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden}
  .on-dark .slot-t{color:var(--cream)}
  #canvas[lang=zh] .txt.slot-t{letter-spacing:.06em;font-weight:700}
  .badge{position:absolute;border:4px solid rgba(204,204,204,.9);border-radius:6px;background:rgba(20,18,17,.55)}
  .studio .badge{background:rgba(255,255,255,.7);border-color:#CCC}
  .badge-v{font-family:var(--f-cond);font-weight:800;font-size:96px;line-height:1;color:var(--cream);white-space:nowrap;font-variant-numeric:tabular-nums}
  .studio .badge-v{color:var(--ink)}
  .badge-v sup{font-size:.42em;color:var(--accent);vertical-align:top;position:relative;top:.12em;margin-left:.06em}
  .badge-l{font-family:var(--f-text);font-weight:700;font-size:22px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,239,227,.86);white-space:nowrap}
  .studio .badge-l{color:var(--muted)}
  #canvas[lang=zh] .txt.badge-l{letter-spacing:.06em}
  .stat .stat-value{white-space:nowrap}
  .txt span.nb{white-space:nowrap}
  #canvas .chip-label{font-family:var(--f-text);font-weight:700;font-size:23px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
  #canvas .chip-value{text-transform:uppercase}
  #canvas[lang=zh] .chip-label{font-size:25px;letter-spacing:.02em}
  #canvas .chip-value{font-size:64px}
  .on-dark .circle-inset{--ring-gap:var(--dark)}
  .inset-ring{position:absolute;border-radius:50%;pointer-events:none}
  #canvas[lang=zh] .stat .stat-label{text-transform:none;letter-spacing:.04em}
</style></head>
<body><div id="canvas"></div>
<script src="engine/runtime.js"></script>
<script>
(function(){
const T = TPL, job = T.job, W = T.W, H = T.H;
T.init();
const zh = job.lang === 'zh', G = 8, cap = 1.25;
const m = Math.max(job.min_margin ?? 60, 72);           // text margin (P2: one flush-left axis at x=m)
const demoH = job.demo ? 40 : 0, floorY = H - demoH;
const land = W / H > 1.2;
let mode = job.mode || (job.scene ? 'overlay' : 'solid');
T.layoutInfo = {mode, landscape: land};
for (const k of ['cta', 'price']) if (job[k]) T.notes.push(`'${k}' ignored: not part of the poster template`);
if ((mode === 'band' || mode === 'overlay') && !job.scene) throw new Error(mode + ' mode needs a scene; use solid mode');

/* accent for words on dark grounds and photos: a dark brand accent is lifted toward cream until it reads (P6) */
if (job.band_color && /^#[0-9a-f]{6}$/i.test(job.band_color)) T.root.style.setProperty('--band', job.band_color);
(function () {
  const hex = String((job.palette || {}).accent || getComputedStyle(T.root).getPropertyValue('--accent') || '#D0612A').trim().replace('#', '');
  if (!/^[0-9a-f]{6}$/i.test(hex)) return;
  const rgb = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16)), cream = [244, 239, 227];
  const lum = c => { const l = v => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * l(c[0]) + .7152 * l(c[1]) + .0722 * l(c[2]); };
  const lift = target => { let t = 0, c = rgb; while (lum(c) < target && t < 0.7) { t += 0.05; c = rgb.map((v, i) => Math.round(v + (cream[i] - v) * t)); } return `rgb(${c.join(',')})`; };
  T.root.style.setProperty('--accent-hi', lift(0.30));       // on the solid warm-dark band
  T.root.style.setProperty('--accent-photo', lift(0.40));    // on a scrimmed photo, whose ground is lighter than the band
})();

/* ---------- optional data (never required; P10: Han text on an en page is dropped) ---------- */
const han = s => /[㐀-鿿]/.test(String(s ?? ''));
const okLang = s => zh || !han(s);
const figs = (Array.isArray(job.figures) ? job.figures : []).filter(r => r && typeof r === 'object' && (r.value != null || r.text)
  && okLang(r.value) && okLang(r.text) && okLang(r.label) && okLang(r.unit)).slice(0, 3);
if (Array.isArray(job.figures) && job.figures.length > figs.length) T.notes.push('some figures dropped (more than 3, or wrong language)');
const numeric = r => r && r.value != null && /^\s*[-+]?\d[\d.,/\-]*\s*$/.test(String(r.value)) && String(r.value).length <= 6;
let stat = job.stat && okLang(job.stat.label) && job.stat.value != null ? job.stat : (figs.find(numeric) || null);
const platform = (() => { const p = job.platform; if (!p) return null;
  const o = typeof p === 'string' ? {value: p} : p; return okLang(o.value) && okLang(o.label) ? o : null; })();
const brandName = job.brand_slot && okLang(job.labels?.brand_slot) ? (job.labels?.brand_slot || '') : '';
const headline = okLang(job.headline) ? job.headline : (T.notes.push('headline has Han text on an en page: dropped'), '');
const support = job.support && okLang(job.support) ? job.support : null;

/* ---------- text measuring ---------- */
function lineInfo(e) {
  const rg = document.createRange(); rg.selectNodeContents(e);
  const qs = [...rg.getClientRects()].filter(q => q.height > 0 && q.width > 0).sort((a, b) => a.top - b.top);
  let lines = 0, cur = -1e9, right = -1e9, left = 1e9;
  for (const q of qs) { const mid = (q.top + q.bottom) / 2; if (mid > cur) { lines++; cur = q.bottom; } else cur = Math.max(cur, q.bottom); right = Math.max(right, q.right); left = Math.min(left, q.left); }
  return {lines, right, left};
}
function fitsIn(e, maxLines) {
  const li = lineInfo(e), r = e.getBoundingClientRect();
  return li.lines <= maxLines && e.scrollWidth <= e.clientWidth + 1 && li.right <= r.right + 1;
}
const written = s => String(T.plain(s)).split('\n').length;
/* textRect: union of the rendered line boxes (what QA and the pixel check measure) */
function textRect(e) {
  const rg = document.createRange(); rg.selectNodeContents(e);
  const qs = [...rg.getClientRects()].filter(q => q.width > 0); const r = e.getBoundingClientRect();
  if (!qs.length) return {x: r.left, y: r.top, w: 0, h: 0};
  const x0 = Math.min(...qs.map(q => q.left)), x1 = Math.max(...qs.map(q => q.right));
  return {x: x0, y: r.top, w: x1 - x0, h: r.height};
}
/* zh line breaks (phrase-safe): the copy's own clauses are kept whole (a break only after ，、；：。), else whole words
   (Intl.Segmenter), else the browser's own CJK breaks. Each unit is a nowrap span; text a \n splits stays split. */
const ZH_PUNCT = '，、；：。！？,;:!?）」』';
function zhUnits(text, level) {
  if (level === 'phrase') return text.match(new RegExp(`[^${ZH_PUNCT}]+[${ZH_PUNCT}]*|[${ZH_PUNCT}]+`, 'g')) || [text];
  if (level === 'word' && typeof Intl !== 'undefined' && Intl.Segmenter) {
    const out = [];
    for (const sg of new Intl.Segmenter('zh', {granularity: 'word'}).segment(text)) {
      if (out.length && (!sg.isWordLike && /^[^\sA-Za-z0-9㐀-鿿]+$/.test(sg.segment) || /^[A-Za-z0-9.%+\-/]+$/.test(sg.segment) && /[A-Za-z0-9.%+\-/]$/.test(out[out.length - 1]))) out[out.length - 1] += sg.segment;
      else out.push(sg.segment);
    }
    return out;
  }
  return [text];
}
function zhWrap(e, level) {
  if (!zh) return;
  e.querySelectorAll('span.nb').forEach(sp => sp.replaceWith(document.createTextNode(sp.textContent)));
  e.normalize();
  if (!level || level === 'none') return;
  const tw = document.createTreeWalker(e, NodeFilter.SHOW_TEXT); const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    String(n.textContent).split(/(\n)/).forEach(part => {
      if (part === '\n' || !part) { if (part) frag.appendChild(document.createTextNode(part)); return; }
      for (const u of zhUnits(part, level)) { const sp = document.createElement('span'); sp.className = 'nb'; sp.textContent = u; frag.appendChild(sp); }
    });
    n.replaceWith(frag);
  }
}
/* Two-tone (P5): with no [[ ]] mark in the copy, the first rendered line stays in the base colour and the rest takes the accent. */
function twoTone(e, str, level) {
  if (job.two_tone === false || /\[\[|\{/.test(str)) return;
  const tw = document.createTreeWalker(e, NodeFilter.SHOW_TEXT); const rg = document.createRange();
  let top0 = null, cut = -1, off = 0;
  outer: while (tw.nextNode()) {
    const node = tw.currentNode, text = node.textContent;
    for (let i = 0; i < text.length; i++) {
      if (/\s/.test(text[i])) continue;
      rg.setStart(node, i); rg.setEnd(node, i + 1); const q = rg.getClientRects()[0]; if (!q) continue;
      if (top0 == null) top0 = q.top; else if (q.top > top0 + q.height * 0.5) { cut = off + i; break outer; }
    }
    off += text.length;
  }
  if (cut < 0) return;
  const text = e.textContent;
  T.markup(e, text.slice(0, cut) + '[[' + text.slice(cut) + ']]');
  zhWrap(e, level);
}
/* Designed headline breaks (P5). The copy's own \n always wins. Otherwise an en headline is broken by meaning: every
   split into 1..maxHl lines is scored – a line may never end on a function word ('with', 'and', 'for'…), a break
   just before one is the natural place, a break between two content words may cut a noun phrase, a lone last word
   is an orphan – and the type shrinks before a worse split is taken. zh: line-end punctuation is dropped (the break
   already separates the phrases); a two-phrase headline may also run on one line, phrase 2 in the accent. */
const FUNC = new Set(['with', 'and', 'for', 'of', 'the', 'a', 'an', 'to', 'in', 'on', 'at', 'by', 'from', 'or', 'into', 'your', 'our', 'its', '&', '+', '–', '-', 'that', 'than', 'via', 'per']);
const bare = wd => T.plain(wd).toLowerCase().replace(/[^a-z&+\-–]/g, '');
const ZH_END = /[，、；：。,;:.！!？?\s]+$/;
function hlCandidates(o) {
  const raw = String(headline || '');
  if (zh) {
    const lines = raw.split('\n').map(s => s.replace(ZH_END, '').trim()).filter(Boolean);
    if (!lines.length) return [{str: '', k: 1, score: 0}];
    const out = [{str: lines.join('\n'), k: lines.length > 1 ? lines.length : Math.min(o.maxHl, 2), score: 0, wrap: lines.length === 1}];
    if (o.join && lines.length > 1 && !/\[\[|\{/.test(raw)) out.push({str: lines[0] + '\u2002[[' + lines.slice(1).join('\u2002') + ']]', k: 1, score: 2, joined: true});
    return out;
  }
  if (raw.includes('\n')) return [{str: raw, k: written(raw), score: 0}];
  const words = raw.trim().split(/\s+/);
  if (words.length < 2 || words.length > 10) return [{str: raw, k: o.maxHl, score: 0, wrap: true}];
  const out = [];
  const rec = (start, lines) => {
    if (start === words.length) {
      const k = lines.length; if (k > o.maxHl) return;
      let sc = k === 1 ? (words.length > 3 ? 4 : 0) : k === 2 ? 0 : 8;
      for (let i = 0; i < k - 1; i++) {
        const last = lines[i][lines[i].length - 1], next = lines[i + 1][0];
        if (FUNC.has(bare(last))) sc += 100;            // never end a line on a preposition/article/conjunction
        else if (!FUNC.has(bare(next))) sc += 12;       // two content words: may split a noun phrase
      }
      if (k > 1 && lines[k - 1].length === 1 && words.length >= 3) sc += 30;   // orphan last word
      const lens = lines.map(l => l.join(' ').length); if (k > 1 && Math.min(...lens) / Math.max(...lens) < 0.3) sc += 6;
      if (sc < 100) out.push({str: lines.map(l => l.join(' ')).join('\n'), k, score: sc});
      return;
    }
    if (lines.length >= o.maxHl) return;
    for (let e = start + 1; e <= words.length; e++) rec(e, lines.concat([words.slice(start, e)]));
  };
  rec(0, []);
  out.sort((a, b) => a.score - b.score);
  out.push({str: raw, k: o.maxHl, score: 200, wrap: true});   // last resort: the browser's own wrap (a too-narrow column)
  return out;
}
const supportText = support ? String(support).replace(/[.。]\s*$/, '') : null;   // no full stop at the end of a display line
/* Headline + support stack, fitted: among the designed splits, the one with the best score + size-step cost whose
   lines, words and total height fit. */
function stack(x, y, w, o) {
  const parent = o.parent;
  const hlSizes = o.hlSizes, maxHl = o.maxHl || 3;
  const cands = hlCandidates({maxHl, join: !!o.join});
  const hl = T.text('headline', cands[0].str, x, y, w, 'hl', {tier: 'headline', maxLines: zh ? Math.max(maxHl, written(headline)) : maxHl, parent, allow: o.allow});
  let sp = null;
  if (supportText) sp = T.text('support', supportText, x, y, Math.min(w, o.subW || w), 'sub', {tier: 'secondary', maxLines: 2, parent, allow: o.allow});
  const levels = zh ? ['phrase', 'word', 'none'] : ['none'];
  const subSizes = o.subSizes || (zh ? [48, 46, 44, 42] : [52, 50, 48, 46, 44]);   // ≈3.3% H, ≥ the 360px-thumbnail floor
  const px = hs => zh ? Math.round(hs * (o.zhScale || 0.84)) : hs;
  const gapOf = () => Math.round(parseFloat(hl.style.fontSize) * 0.34);             // ≈ half the cap height, on every layout
  const fitSub = () => {                          // the support line: largest size and most phrase-safe break that fits 2 lines
    for (const lv of levels) { zhWrap(sp, lv); for (const s of subSizes) { sp.style.fontSize = s + 'px'; if (fitsIn(sp, 2)) return s; } }
    zhWrap(sp, 'none'); sp.style.fontSize = subSizes[subSizes.length - 1] + 'px'; return null;
  };
  if (sp) fitSub();
  const subH = sp ? T.rect(sp).h : 0;
  // try every candidate × level × size; cost = split score + 4 per size step below the largest size anything fits at
  const trials = [];
  for (const c of cands) {
    T.markup(hl, c.str);
    const lvls = zh && c.wrap ? levels : ['none'];
    for (const lv of lvls) {
      zhWrap(hl, lv);
      for (let i = 0; i < hlSizes.length; i++) {
        hl.style.fontSize = px(hlSizes[i]) + 'px';
        if (!fitsIn(hl, c.k)) continue;
        const total = T.rect(hl).h + (sp ? gapOf() + subH : 0);
        if (o.hmax && total > o.hmax) continue;

    const t = trials.sort((a, b) => a.cost - b.cost)[0];
    T.markup(hl, t.c.str); zhWrap(hl, t.lv); hl.style.fontSize = px(hlSizes[t.i]) + 'px';
    best = {hs: hlSizes[t.i], ok: true, cand: t.c}; hlLevel = t.lv;
    T.layoutInfo.headline_split = t.c.str.split('\n').length + (t.c.joined ? ' (joined)' : '') + ' lines, score ' + t.c.score;
  } else {
    // nothing fits the height: the smallest step, with the best-scored split that at least fits its lines in the width
    const hs = hlSizes[hlSizes.length - 1]; hl.style.fontSize = px(hs) + 'px';
    let c = cands[0];
    for (const k of cands) { T.markup(hl, k.str); zhWrap(hl, zh && k.wrap ? 'phrase' : 'none'); if (fitsIn(hl, k.k)) { c = k; break; } }
    T.markup(hl, c.str); zhWrap(hl, zh && c.wrap ? 'phrase' : 'none');
    best = {hs, ok: false, cand: c}; hlLevel = zh && c.wrap ? 'phrase' : 'none';

  const place = top => { hl.style.top = top + 'px'; if (sp) sp.style.top = (top + T.rect(hl).h + best.gap) + 'px'; };
  place(y);

  return {hl, sp, size: best.hs, ok: best.ok, remove() { hl.remove(); if (sp) sp.remove(); }, get h() { return T.rect(hl).h + (sp ? best.gap + T.rect(sp).h : 0); }, place,
          rects() { return [textRect(hl)].concat(sp ? [textRect(sp)] : []); }};
}

/* ---------- graphic pieces ---------- */
function badge(x, y, parent) {      // platform / voltage badge: outlined box, big condensed numeral + small caps line
  if (!platform) return null;
  const b = T.el('div', {class: 'badge', 'data-qa': 'badge', 'data-kind': 'shape', 'data-allow': 'badge_v,badge_l'}, parent);
  const v = T.el('div', {class: 'txt badge-v', 'data-qa': 'badge_v', 'data-kind': 'text', 'data-tier': 'important', 'data-maxlines': '1', 'data-allow': 'badge'}, b);
  v.textContent = String(platform.value);
  if (platform.sup) { const s = document.createElement('sup'); s.textContent = platform.sup; v.appendChild(s); }
  T.box(v, 22, 14, null, null);
  let lw = 0;
  if (platform.label) { const l = T.el('div', {class: 'txt badge-l', 'data-qa': 'badge_l', 'data-kind': 'text', 'data-tier': 'meta', 'data-maxlines': '1', 'data-allow': 'badge'}, b, platform.label); T.box(l, 24, 14 + 96 + 4, null, null); lw = l.getBoundingClientRect().width; }
  const bw = Math.ceil(Math.max(v.getBoundingClientRect().width, lw) + 48), bh = platform.label ? 14 + 96 + 4 + 22 + 20 : 96 + 28;
  T.box(b, x, y, bw, bh);
  return {x, y, w: bw, h: bh};
}
function brandSlot(x, y, align, parent) {   // replaceable brand area: the brand's own name set in the display face, never a source logo
  if (!job.brand_slot) return null;
  const h = 72, t = brandName || (job.labels?.brand_slot ?? '');
  const s = T.el('div', {class: 'slot', 'data-qa': 'brand_slot', 'data-kind': 'shape', 'data-allow': 'brand_slot_t'}, parent);
  const tx = T.text('brand_slot_t', t || ' ', 0, 0, null, 'slot-t', {tier: 'meta', maxLines: 1, parent, allow: ['brand_slot']});
  tx.style.width = 'auto';
  const tw = Math.min(Math.ceil(tx.getBoundingClientRect().width), 420), w = Math.max(220, tw + 56);
  const bx = align === 'right' ? x - w : x;
  T.box(s, bx, y, w, h); T.box(tx, bx + (w - tw) / 2, y + (h - 30) / 2, tw, null);
  return {x: bx, y, w, h};
}
/* a chip's small caps line is a caption (chip-label 24px, P4 meta tier), not a secondary line held to the 42px floor */
const CH = 136;   // chip height: the 64px condensed value over the 23px tracked caps label
function metaLabel(c) {   // caption tier, and the value+label pair centred in the chip's height
  const l = c.el.querySelector('.chip-label'), v = c.el.querySelector('.chip-value'); if (l) l.setAttribute('data-tier', 'meta');
  if (l && v) { const vh = v.getBoundingClientRect().height, lh = l.getBoundingClientRect().height, t = Math.round((CH - vh - 6 - lh) / 2);
    v.style.top = t + 'px'; l.style.top = (t + vh + 6) + 'px'; }
}
function sameWidth(made) { const w = Math.max(...made.map(c => c.w)); for (const c of made) { c.w = w; c.el.style.width = w + 'px'; } }

    const bleedX = Math.round(cw * (job.hero_bleed ?? 0.03)), bleedY = Math.round(ch * (job.hero_bleed ?? 0.03) * 1.5);
    const xs = [], ys = [];
    if (top) {                                            // centred under the words, sitting on the floor; right-aligned if a slot needs the left
      if (land) xs.push(W - mgX - cw); else xs.push((W - cw) / 2, W - mgX - cw);
      const hb = job.hero_bleed ? Math.round(ch * job.hero_bleed) : 0;
      ys.push(floorY - mgB - ch + hb);
    } else {
    const xr = W - m - cw;                                // flush right at the margin, then bleeding off the right edge
    for (let d = 0; d <= bleedX + m; d += 12) xs.push(xr + d);
    const ybase = Math.min(floorY - m - ch, Math.max(m, (floorY - ch) / 2 + 30));
    for (let d = 0; ybase + d + ch <= floorY + bleedY; d += 12) ys.push(ybase + d);
    if (!ys.length) ys.push(Math.max(m * 0.5, floorY - ch));
    }
    for (const cy of ys) { for (const cx of xs) {
      if (cx < m * 0.5 || cy < m * 0.5) continue;
      const ix = cx - cb[0] * iw, iy = cy - cb[1] * ih;
      const poly = hull.map(([u, v]) => [ix + u * iw, iy + v * ih]);
      if (clear(poly)) { pick = {sc, cx, cy, cw, ch, ix, iy, iw, ih}; break; }
    } if (pick) break; }
  }
  if (!pick) {   // nothing clears the text: contain below/right of the column at a size that does
    const sc = Math.min(cap, (W - m - (m + colW + 4 * G)) / cw0, (floorY - 2 * m) / ch0);
    const cw = cw0 * sc, ch = ch0 * sc, iw = a.width * sc, ih = a.height * sc, cx = W - m - cw, cy = floorY - m - ch;
    pick = {sc, cx, cy, cw, ch, ix: cx - cb[0] * iw, iy: cy - cb[1] * ih, iw, ih};
    T.notes.push('product kept to the right column: no larger placement clears the text');
  }
  const bleeds = pick.ix < -0.5 || pick.iy < -0.5 || pick.ix + pick.iw > W + 0.5 || pick.iy + pick.ih > H + 0.5;
  const contentBottom = pick.cy + pick.ch;
  if (contentBottom < floorY - 8) {
    const sh = T.el('div', {class: 'shadow', 'data-exempt': '1'}); const swd = pick.cw * 0.86;
    T.box(sh, pick.cx + (pick.cw - swd) / 2, contentBottom - 46, swd, 60);
  }
  T.img('hero', job.hero, {x: pick.ix, y: pick.iy, w: pick.iw, h: pick.ih}, {blend: 'multiply', bleed: bleeds});
  T.layoutInfo.hero_scale = +pick.sc.toFixed(3);
  T.layoutInfo.hero_cover = +((pick.cw * pick.ch) / (W * H)).toFixed(3);
  T.layoutInfo.hero_bbox = [pick.cx, pick.cy, pick.cw, pick.ch].map(Math.round);
  // keep the text above the product image in paint order
  for (const id of ['rule', 'headline', 'support', 'chip1', 'chip2', 'chip3', 'brand_slot', 'brand_slot_t', 'badge']) { const e = document.querySelector(`[data-qa="${id}"]`); if (e && e.parentNode === T.root) T.root.appendChild(e); }
  T.placeBadges({x: m, y: m, w: W - 2 * m, h: floorY - 2 * m}, {max: 2, style: 'burst'});    // the brand's badges where the poster leaves room
}
// on a photograph the brand's badges go where they cover neither the words nor the product in the scene
if (mode === 'overlay' || mode === 'band') T.placeBadges({x: m, y: m, w: W - 2 * m, h: H - 2 * m}, {max: 2, style: 'burst', overPhotos: true});
T.watermark();
T.finish();
})();
</script></body></html>
